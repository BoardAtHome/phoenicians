# Render Blueprint: one web service (game server + client) and one Postgres database.
# Create it from the Render dashboard with New > Blueprint and pick this repo.
services:
  - type: web
    name: phoenicians
    runtime: node
    plan: free # free sleeps after ~15 idle minutes; "starter" stays awake
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/config
    autoDeployTrigger: checksPass # deploy main only after GitHub Actions CI passes
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ADMIN_PASSWORD
        sync: false # entered in the dashboard, never committed
      - key: DATABASE_URL
        fromDatabase:
          name: phoenicians-db
          property: connectionString
databases:
  - name: phoenicians-db
    # Free databases are deleted 30 days (+14 days grace) after creation, with no backups.
    # Switch to the smallest paid plan (0.1c-256mb, about $6/month) to keep configs and games.
    plan: free
